function revealClass(direction = 'up') {

}

  return `<div class="placeholder ${gradient} ${image ? 'has-image' : ''}" style="min-height:${minHeight}px">

    <div class="placeholder-content">
      <div class="placeholder-icon">${iconSvg.panel}</div>
      <div>${text}</div>
    </div>
  </div>`;
}

function initReveal() {
  const reveals = document.querySelectorAll('.reveal');
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('visible');
        observer.unobserve(entry.target);
      }
    });
  }, { threshold: 0.1, rootMargin: '0px 0px -50px 0px' });
  reveals.forEach((el, i) => {
    el.style.transitionDelay = `${Math.min(i * 60, 320)}ms`;
    observer.observe(el);
  });
}

function initCounters() {
  const counters = document.querySelectorAll('.counter');
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (!entry.isIntersecting) return;
      const el = entry.target;
      const target = Number(el.dataset.target || 0);
      const suffix = el.dataset.suffix || '';
      const start = performance.now();
      const duration = 2000;
      function tick(now) {
        const progress = Math.min((now - start) / duration, 1);
        const eased = 1 - Math.pow(1 - progress, 3);
        el.textContent = `${Math.floor(eased * target)}${suffix}`;
        if (progress < 1) requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
      observer.unobserve(el);
    });
  }, { threshold: 0.5 });
  counters.forEach(counter => observer.observe(counter));
}

    (function initTestimonialSlider() {
      const track = document.getElementById('testimonialTrack');
      const dots = document.querySelectorAll('#testimonialDots span');
      const prevBtn = document.getElementById('testimonialPrev');
      const nextBtn = document.getElementById('testimonialNext');
      if (!track || !dots.length) return;

      let current = 0;
      const total = dots.length;

      function goTo(index) {
        if (index < 0) index = total - 1;
        if (index >= total) index = 0;
        current = index;
        track.style.transform = `translateX(-${current * 100}%)`;
        dots.forEach((dot, i) => dot.classList.toggle('active', i === current));
      }

      function next() { goTo(current + 1); }
      function prev() { goTo(current - 1); }

      // Attach event listeners (buttons are now clickable)
      if (nextBtn) nextBtn.addEventListener('click', (e) => { e.stopPropagation(); next(); });
      if (prevBtn) prevBtn.addEventListener('click', (e) => { e.stopPropagation(); prev(); });

      dots.forEach((dot, i) => {
        dot.addEventListener('click', () => goTo(i));
      });

      // Optional: auto-play
      let interval = setInterval(next, 6000);
      const slider = document.getElementById('testimonialSlider');
      if (slider) {
        slider.addEventListener('mouseenter', () => clearInterval(interval));
        slider.addEventListener('mouseleave', () => { interval = setInterval(next, 6000); });
      }
    })();


  </script>

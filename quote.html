function initNav() {
  const nav = document.getElementById('siteNav');
  const toggle = document.getElementById('mobileToggle');
  const menu = document.getElementById('mobileMenu');
  if (toggle && menu) {
    toggle.addEventListener('click', () => { menu.classList.toggle('open'); toggle.innerHTML = menu.classList.contains('open') ? icon('close') : icon('menu'); });
  }
  window.addEventListener('scroll', () => { nav.classList.toggle('scrolled', window.scrollY > 20); document.getElementById('quoteFab')?.classList.toggle('show', window.scrollY > 400); });
}
function initReveal() {
  const reveals = document.querySelectorAll('.reveal');
  const observer = new IntersectionObserver((entries) => { entries.forEach(entry => { if (entry.isIntersecting) { entry.target.classList.add('visible'); observer.unobserve(entry.target); } }); }, { threshold: 0.1, rootMargin: '0px 0px -50px 0px' });
  reveals.forEach((el, i) => { el.style.transitionDelay = `${Math.min(i * 60, 320)}ms`; observer.observe(el); });
}
function initCounters() {
  const counters = document.querySelectorAll('.counter');
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (!entry.isIntersecting) return;
      const el = entry.target;
      const target = Number(el.dataset.target || 0);
      const suffix = el.dataset.suffix || '';
      const start = performance.now();
      const duration = 2000;
      function tick(now) {
        const progress = Math.min((now - start) / duration, 1);
        const eased = 1 - Math.pow(1 - progress, 3);
        el.textContent = `${Math.floor(eased * target)}${suffix}`;
        if (progress < 1) requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
      observer.unobserve(el);
    });
  }, { threshold: 0.5 });
  counters.forEach(counter => observer.observe(counter));
}
function initNewsletter() {
  const form = document.getElementById('newsletterForm');
  const email = document.getElementById('newsletterEmail');
  const success = document.getElementById('newsletterSuccess');
  if (!form || !email || !success) return;
  form.addEventListener('submit', (e) => { e.preventDefault(); if (!email.value.trim()) return; success.classList.add('show'); email.value = ''; });
}
function validateEmail(value) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value); }

function initQuoteForm() {
  const form = document.getElementById('quoteForm');
  if (!form) return;
  const success = document.getElementById('quoteSuccess');
  const reset = document.getElementById('quoteReset');
  const errorBox = document.getElementById('quoteError');
  
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    errorBox.classList.remove('show');
    
    // Validate required fields
    const name = document.getElementById('quote-name')?.value.trim();
    const email = document.getElementById('quote-email')?.value.trim();
    const service = document.getElementById('quote-service')?.value;
    const description = document.getElementById('quote-description')?.value.trim();
    
    let valid = true;
    if (!name) valid = false;
    if (!email || !validateEmail(email)) valid = false;
    if (!service) valid = false;
    if (!description) valid = false;
    
    if (!valid) {
      errorBox.classList.add('show');
      return;
    }
    
    // Submit the form via fetch for better UX
    fetch(form.action, {
      method: 'POST',
      body: new FormData(form),
      headers: {
        'Accept': 'application/json'
      }
    }).then(response => {
      if (response.ok) {
        form.classList.add('hidden');
        success.style.display = 'block';
        success.scrollIntoView({ behavior: 'smooth', block: 'center' });
      } else {
        errorBox.classList.add('show');
      }
    }).catch(() => {
      errorBox.classList.add('show');
    });
  });
  
  reset?.addEventListener('click', () => {
    success.style.display = 'none';
    form.classList.remove('hidden');
    form.reset();
  });
}
initNav(); initReveal(); initCounters(); initNewsletter(); initQuoteForm();
